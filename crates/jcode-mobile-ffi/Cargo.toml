[package]
name = "jcode-mobile-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI JSON bridge for the jcode mobile Rust core"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
jcode-mobile-core = { path = "../jcode-mobile-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
